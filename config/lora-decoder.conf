# LoRa Decoder configuration.
# The app rewrites the application and lora sections when you change settings;
# the radio, meshtastic and meshcore sections are only read, edit them by hand.

[application]
dark_mode=yes

[lora]
band=EU868
profile=all
hunt_dwell_ms=0
spectrum_step_hz=50000
listen_step_hz=25000
listen_freq_hz=869525000
listen_bw_hz=250000
listen_sf=11
listen_cr=5
listen_sync=0x2B
listen_preamble=16
listen_iq_inverted=no
listen_crc=yes

[radio]
# auto = sx1262 on the device, simulator on desktop builds. Values: auto | sx1262 | sim
backend=auto
# Defaults: M5Stack Cap LoRa-1262 on the CardputerZero EXT header
#   NSS  = GPIO7  (SPI0 CE1 -> /dev/spidev0.1)   SCK/MOSI/MISO = GPIO11/10/9
#   RST  = GPIO26 (HAT_P0)   DIO1 = GPIO23 (HAT_P1, not needed)   BUSY = GPIO22
#   antenna switch = PI4IOE5V6408 P0 @ 0x43 on I2C1 (GPIO2/3 -> /dev/i2c-1)
# HAT_P0/P1 must stay in GPIO mode (default), not USB.
spi_device=/dev/spidev0.1
spi_speed_hz=2000000
gpio_chip=/dev/gpiochip0
pin_reset=26
pin_busy=22
# Optional RF switch / LNA enables on other modules (e.g. Ebyte E22). TX is never used.
pin_rxen=-1
pin_txen=-1
# TCXO supply driven by DIO3 (Cap LoRa-1262: 3.0 V), 0 = plain crystal.
tcxo_voltage=3.0
dio2_rf_switch=yes
# Cap LoRa-1262 example code uses the LDO regulator.
use_dcdc=no
rx_boosted_gain=yes
# 5 V rail feeding the cap (CardputerZero EXT 5VOUT). Switched on at start and restored on exit.
# power_switch=none to leave it alone.
power_switch=/sys/class/leds/ext_5v_out/brightness
power_on_delay_ms=300
# I2C I/O expander that enables the antenna switch; antenna_switch_pin=-1 to disable.
antenna_switch_i2c=/dev/i2c-1
antenna_switch_address=0x43
antenna_switch_pin=0

[meshtastic]
# Extra channels to decrypt, as  ChannelName=base64PSK  (default key AQ== is always tried
# with every modem-preset channel name).
# MyGroup=1PG7OiApB1nwvP+rz05pAQ==

[meshcore]
# Extra MeshCore channels to decrypt, as  ChannelName=secret  (16 bytes, base64 or 32 hex digits).
# The built-in "Public" channel (8b3387e9c5cdea6ac9e5edbaa115cd72) is always tried.
# MyGroup=00112233445566778899aabbccddeeff
